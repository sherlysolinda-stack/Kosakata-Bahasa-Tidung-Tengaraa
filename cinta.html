<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Untuk Kamu ❤️</title>

<style>
body{
    margin:0;
    font-family:'Segoe UI',sans-serif;
    height:100vh;
    background:linear-gradient(to top,#fbc2eb,#a6c1ee);
    overflow:hidden;
}

.page{
    position:absolute;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    transition:opacity 1s ease;
}

.hidden{
    opacity:0;
    pointer-events:none;
}

/* PAGE 1 */
.love-btn{
    font-size:80px;
    cursor:pointer;
    animation:pulse 1s infinite;
}

@keyframes pulse{
    0%{transform:scale(1);}
    50%{transform:scale(1.2);}
    100%{transform:scale(1);}
}

h1{
    color:white;
}

/* PAGE 2 */
.card{
    background:white;
    padding:20px;
    border-radius:20px;
    width:90%;
    max-width:380px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.3);
}

.card img{
    width:100%;
    border-radius:15px;
    margin-bottom:15px;
    animation:fadeIn 2s ease;
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:1;}
}

p{
    font-size:16px;
    color:#444;
    min-height:150px;
}

.walker{
    position:absolute;
    bottom:20px;
    left:-100px;
    font-size:40px;
    animation:walk 10s linear infinite;
}

@keyframes walk{
    from{left:-100px;}
    to{left:110%;}
}
</style>
</head>

<body>

<!-- PAGE 1 -->
<div class="page" id="page1">
    <div class="love-btn" onclick="goNext()">❤️</div>
    <h1>Klik Aku</h1>
</div>

<!-- PAGE 2 -->
<div class="page hidden" id="page2">
    <div class="walker">🚶‍♂️❤️</div>

    <div class="card">
        <!-- GANTI LINK FOTO DI BAWAH -->
        <img src="https://drive.google.com/thumbnail?id=1JgH9NPaoqsB7XtfcIJtT1406lBiTU0dY&sz=w600
">

        <p id="text"></p>
    </div>
</div>

<script>
function goNext(){
    document.getElementById("page1").classList.add("hidden");
    document.getElementById("page2").classList.remove("hidden");
    setTimeout(typeEffect,1000);
}

const message = `
Selamat pagi, kamu yang selalu ada di hatiku.
Melihat wajahmu saja sudah cukup
membuat hariku terasa lebih hangat.

Aku mungkin tidak selalu pandai berkata-kata,
tapi percayalah,
setiap perhatianku padamu adalah bentuk cintaku.

Jika hari ini kamu lelah,
ingatlah ada aku
yang selalu ingin menjadi tempat pulangmu ❤️
`;

let index=0;
const speed=40;
const textEl=document.getElementById("text");

function typeEffect(){
    if(index<message.length){
        textEl.innerHTML+=message.charAt(index);
        index++;
        setTimeout(typeEffect,speed);
    }
}
</script>

</body>
</html>
