<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Kosa Kata Bahasa Tidung Tengara</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
    font-family: "Segoe UI", Arial, sans-serif;
    background:#ececec;
    margin:0;
    padding:15px;
}

h1{
    text-align:center;
    margin-bottom:20px;
    color:#2c3e50;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
    gap:15px;
}

.card{
    background:#fff;
    border:2px solid #ddd;
    padding:10px;
    text-align:center;
}

.card img{
    width:100%;
    height:140px;
    object-fit:cover;
    border:1px solid #ccc;
}

.indo{
    margin-top:8px;
    font-weight:bold;
    font-size:14px;
}

.tidung{
    font-size:13px;
    color:#555;
}

button{
    margin-top:8px;
    width:100%;
    padding:8px;
    background:#3498db;
    color:white;
    border:none;
    font-size:14px;
    cursor:pointer;
}

button:hover{
    background:#1f78c1;
}
</style>
</head>

<body>

<h1>Kosa Kata Bahasa Tidung Tengara</h1>

<div class="grid">

<div class="card">
    <img src="https://drive.google.com/thumbnail?id=1TMRTwSEeDfcdLOqL-CndOZ1Z9b6n56Nw&sz=w600">
    <div class="indo">pecekkkkkkkkkkkk</div>
    <div class="tidung">cayangkuuuuuuu</div>
    <button onclick="bicara('Baloy artinya rumah')">🔊 Dengar</button>
</div>

<div class="card">
    <img src="https://drive.google.com/thumbnail?id=1ZcV3iK8pm8Mb9iJOAuLFpEBlkGQhkWUF&sz=w600">
    <div class="indo">Air</div>
    <div class="tidung">Timuk</div>
    <button onclick="bicara('Timuk artinya air')">🔊 Dengar</button>
</div>

<div class="card">
    <img src="https://drive.google.com/thumbnail?id=1rsI_Ad9GXDgmVrUMfvucsa0S4UWkhnXs&sz=w600">
    <div class="indo">Makan</div>
    <div class="tidung">Ngakan</div>
    <button onclick="bicara('Ngakan artinya makan')">🔊 Dengar</button>
</div>

</div>

<script>
function bicara(teks){
    const suara = new SpeechSynthesisUtterance(teks);
    suara.lang = "id-ID";
    suara.rate = 0.9;
    speechSynthesis.speak(suara);
}
</script>

</body>
</html>
